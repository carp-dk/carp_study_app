allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        flatDir {
            dirs "$rootDir/libs"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // ponytail: mdsflutter ships an old compileSdk; android:attr/lStar needs 31+
    if (project.name == 'mdsflutter') {
        def forceSdk = { project.android.compileSdkVersion 34 }
        if (project.state.executed) forceSdk() else project.afterEvaluate { forceSdk() }
    }
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
