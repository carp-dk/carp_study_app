name: carp_study_app
description: The generic CARP study app.
publish_to: "none"
# Bump only the version name for a release; the `+N` build number is ignored by CI
# (Fastlane auto-increments the Play versionCode; iOS uses the Xcode Cloud build number).
version: 4.4.3+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  carp_serializable: ^3.0.0
  carp_core: ^2.2.1
  carp_mobile_sensing: ^2.3.1
  carp_context_package: ^2.1.0
  carp_connectivity_package: ^2.2.0
  carp_survey_package: ^2.1.1
  carp_audio_package: ^2.1.0
  carp_polar_package: ^2.1.0
  carp_health_package: ^4.1.0
  carp_movesense_package: ^3.1.0
  carp_themes_package: ^0.2.1

  carp_webservices: ^4.3.0
  carp_backend: ^2.1.1

  research_package: ^3.2.0
  cognition_package: ^1.9.0

  url_launcher: ^6.1.5
  timeago: ^3.1.0
  expandable: ^5.0.1
  camera: ^0.11.1
  video_player: ^2.2.7
  path_provider: ^2.0.2
  json_annotation: ^4.4.0

  flutter_localizations:
    sdk: flutter
  intl: ">= 0.19.0 <= 0.21.0"

  fl_chart: 1.0.0
  google_fonts: ^6.1.0
  go_router: ^15.0.0
  flutter_svg: ^2.0.4
  flutter_blue_plus: ^1.15.5
  permission_handler: ^12.0.3
  connectivity_plus: ^7.0.0
  open_settings_plus: ^0.4.0
  appcheck: ^1.5.2
  flutter_plugin_android_lifecycle: ^2.0.24
  camera_android_camerax: ^0.6.10+1
  app_version_update: ^7.0.0
  country_code_picker: ^3.3.0
  intl_phone_number_input: ^0.7.4
  qr_code_scanner_plus: ^2.0.10+1
  share_plus: ^13.3.0
  shimmer: ^3.0.0

dependency_overrides:
  # carp_themes_package:
  #   path: ../carp_themes_package

  # polar: 7.5.1

  # camera_android_camerax: 0.6.10+1
  # flutter_plugin_android_lifecycle: 2.0.24

  # Overriding carp libraries to use the local copy, if needed
  # carp_serializable:
  #   path: ../carp.sensing-flutter/carp_serializable/
  # carp_core:
  #   path: ../carp.sensing-flutter/carp_core/
  # carp_mobile_sensing:
  #   path: ../carp.sensing-flutter/carp_mobile_sensing/
  # carp_context_package:
  #   path: ../carp.sensing-flutter/packages/carp_context_package/
  # carp_health_package:
  #   path: ../carp.sensing-flutter/packages/carp_health_package/
  # carp_polar_package:
  #   path: ../carp.sensing-flutter/packages/carp_polar_package/
  # carp_movesense_package:
  #   path: ../carp.sensing-flutter/packages/carp_movesense_package/
  # carp_connectivity_package:
  #   path: ../carp.sensing-flutter/packages/carp_connectivity_package/
  # carp_survey_package:
  #   path: ../carp.sensing-flutter/packages/carp_survey_package/
  # carp_audio_package:
