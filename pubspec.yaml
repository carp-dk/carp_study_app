  # research_package:
  #   path: ../research.package/
  # cognition_package:
  #   path: ../cognition_package

dev_dependencies:
  test: any
  json_serializable: any
  build_runner: any
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: any
  flutter_lints: any

# Is used to change the default app launch icons on iOS and Android.
# To install:
#  1. import the 'flutter_launcher_icons' package above
#  2. add the 'flutter_icons:' section below
#  3. run 'flutter pub get'
#  3. run 'dart run flutter_launcher_icons:main'

flutter:
  # Route all iOS native deps through CocoaPods. The Polar BLE SDK (via the
  # `polar` plugin) and Movesense (`mdsflutter`, CocoaPods-only) both pull in
  # SwiftProtobuf; with Swift Package Manager enabled Polar resolves it via SPM
  # while Movesense uses CocoaPods, producing duplicate-symbol link errors.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/images/
    - assets/instructions/
    - assets/instructions/en/
    - assets/instructions/da/
    - assets/icons/
    - assets/lang/
    - assets/carp/lang/
    - assets/carp/resources/
    - assets/images/messages/
    - assets/carp_logo.png
    - assets/logo.png

  #  auto generate json code (.g files) with:
  #    dart run build_runner build --delete-conflicting-outputs
