name: 🐞 Bug fix
description: Create a report to help us improve any bug you may experience.
title: "[Bug]: "
labels: ["bugfix"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Bug Report Form
        Thank you for taking the time to report a bug. Please provide as much detail as possible to help us investigate and resolve the issue quickly.
        
        **Note:** Fields marked with an asterisk (*) are required.

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Which version of the app are you currently using?
      placeholder: "e.g. 1.5"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) are you experiencing the issue on?
      multiple: true
      options:
        - iOS
        - Android
        - Both iOS and Android
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: What OS version is your device running?
      placeholder: "e.g., iOS 15.1, Android 12"
    validations:
      required: true

  - type: input
    id: affected-screen
    attributes:
      label: Affected Screen / Feature
      description: Where in the app did the bug happen? Be specific — name the screen, tab, or feature.
      placeholder: "e.g., Study consent screen, Heart rate task, Settings → Account"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of what the bug is.
      placeholder: "Describe what's happening..."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: |
        How can we reproduce this issue? Be specific — every step a fresh install needs to hit the same bug.
        Include the exact account / study / invitation code used, whether you were logged in, and any toggles or permissions that were on/off.
      value: |
        1. Start from '...' (fresh install? logged in? which study/invitation?)
        2. Go to '...'
        3. Tap on '...'
        4. Observe the error
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How consistently does this bug occur when following the steps above?
      options:
        - Always (100%)
        - Often (more than half the time)
        - Sometimes (less than half the time)
        - Once (could not reproduce)
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Study / Protocol Configuration
      description: |
        If the bug depends on a specific study, deployment, sampling package, or device configuration, describe (or paste) it here. Include the deployment ID / invitation code if applicable.
      placeholder: |
        - Study: ...
        - Deployment ID / invitation code: ...
        - Sampling packages enabled: ...
        - Paired external devices (Polar, Movesense, etc.): ...

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Describe what you expected..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Describe what you observed instead..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Debug Logs
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell
      placeholder: |
        [Paste your logs here]
        The text will be automatically formatted into code.

  - type: textarea
    id: flutter-doctor
    attributes:
      label: Flutter Doctor Output
      description: |
        Developer reporters only — paste the output of `fvm flutter doctor -v` (or `flutter doctor -v` if not using FVM). Skip this section if you're reporting as an end user.
      render: shell
      placeholder: |
        [Paste `fvm flutter doctor -v` output here]

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: |
        Drag and drop your images here.
        You can also provide a brief description of each screenshot.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (environment details, potential causes, solutions tried)
      placeholder: "Any additional information that might help us investigate..."
