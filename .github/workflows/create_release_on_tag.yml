on:
  push:
    tags:
      - "v*"

name: Create Release

jobs:
  apk:
    name: Create Release and Upload APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "adopt" # See 'Supported distributions' for available options
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Cache Gradle
        id: cache-gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-ubuntu-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Configure Keystore
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "$PLAY_STORE_CONFIG_JSON" > PLAY_STORE_CONFIG.json
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        working-directory: android

      - name: Print Flutter Version
        run: |
          flutter --version
          pwd

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      # Attach the APK to the release for this tag, creating the release if needed.
      - name: Upload APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          cp build/app/outputs/flutter-apk/app-release.apk "carp-studies-app-$GITHUB_REF_NAME.apk"
          gh release upload "$GITHUB_REF_NAME" "carp-studies-app-$GITHUB_REF_NAME.apk" --clobber

      # Setup Ruby/Bundler so fastlane is available
      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
          working-directory: android

      # Production release to Google Play runs only on tags (like the iOS
      # App Store workflow on Xcode Cloud).
      - if: startsWith(github.ref, 'refs/tags/')
        run: fastlane release
        env:
          PLAY_STORE_JSON_KEY: PLAY_STORE_CONFIG.json
        working-directory: android
